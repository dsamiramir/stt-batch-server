[project]
name = "stt-batch-server"
version = "0.1.0"
description = "Local multi-channel STT batch server (faster-whisper) with off-peak scheduling"
requires-python = ">=3.11,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "faster-whisper>=1.1.0",
    "av>=12.0",
    "numpy>=1.26",
    "httpx>=0.27",
    "nvidia-cublas-cu12==12.8.4.1 ; sys_platform == 'win32'",
    "nvidia-cudnn-cu12>=9.8,<10 ; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
